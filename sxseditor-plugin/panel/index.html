<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>OneMix · 一键混音</title>
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
  <div class="om-header">
    <div class="om-logo">◉ OneMix</div>
    <div class="om-sub">人声 + 伴奏 → 成品母带 · 与 Rust 版能力一致</div>
  </div>

  <div class="om-body">
    <div class="om-field">
      <label>人声 WAV 路径</label>
      <input type="text" id="vocals" placeholder="例如：C:\Music\vocals.wav">
    </div>
    <div class="om-field">
      <label>伴奏 WAV 路径</label>
      <input type="text" id="accom" placeholder="例如：C:\Music\instrumental.wav">
    </div>
    <div class="om-field">
      <label>输出路径</label>
      <input type="text" id="output" placeholder="例如：C:\Music\final_mix.wav">
    </div>

    <div class="om-grid">
      <div class="om-field">
        <label>预设</label>
        <select id="preset">
          <option value="streaming">流媒体 (-14 LUFS)</option>
          <option value="broadcast">广播 (-16 LUFS)</option>
          <option value="quiet">安静 (-20 LUFS)</option>
          <option value="loud">响亮 (-12 LUFS)</option>
        </select>
      </div>
      <div class="om-field">
        <label>目标响度 LUFS</label>
        <input type="number" id="lufs" value="-14" step="0.5">
      </div>
      <div class="om-field">
        <label>人声增益 dB</label>
        <input type="number" id="vgain" value="0" step="0.5">
      </div>
      <div class="om-field">
        <label>伴奏闪避 dB</label>
        <input type="number" id="duck" value="-2.5" step="0.5">
      </div>
    </div>

    <label class="om-check"><input type="checkbox" id="nn"> 启用 NN 音质增强（ONNX）</label>

    <div class="om-actions">
      <button type="button" id="btnProbe">探测文件</button>
      <button type="button" id="btnMix" class="primary">⚡ 一键混音</button>
    </div>

    <div class="om-progress">
      <div class="om-bar"><div id="barFill"></div></div>
      <span id="stage">就绪</span>
    </div>

    <pre id="out">等待宿主连接…</pre>
    <p class="om-note">提示：路径需为本工程/MCP 已授权目录内。也可通过 MCP 调用 <code>onemix-mixer.mix</code> 一次性混音。</p>
  </div>

  <script src="./panel.js"></script>
</body>
</html>
